server {
  listen 80;
  listen [::]:80;
  server_name www.rodreegez.com;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  return 308 https://rodreegez.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name rodreegez.com;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /favicon.svg {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
